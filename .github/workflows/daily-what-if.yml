name: Daily What If video

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: whatifly-daily-video
  cancel-in-progress: false

jobs:
  render-and-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Skip dates already covered by verification uploads
        id: guard
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && { [ "$today" = "2026-11-05" ] || [ "$today" = "2026-11-07" ]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A verified video is already scheduled for $today."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          ref: main
      - uses: actions/setup-python@v5
        if: ${{ steps.guard.outputs.skip != 'true' }}
        with:
          python-version: '3.12'
      - name: Install free local renderer tools
        if: ${{ steps.guard.outputs.skip != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow
      - name: Render and self-check episode
        if: ${{ steps.guard.outputs.skip != 'true' }}
        id: render
        run: |
          if ! python automation/render.py > /tmp/episode.json 2> /tmp/render-error.txt; then
            if grep -q "PREMISES_EXHAUSTED" /tmp/render-error.txt; then
              if ! gh issue list --state open --search "What If premise bank exhausted" --json number --jq 'length > 0' | grep -q true; then
                gh issue create --title "What If premise bank exhausted" --body "The renderer used all three researched premises and stopped rather than repeating one. Ask Codex to add and fact-check more premises."
              fi
              exit 1
            fi
            cat /tmp/render-error.txt
            exit 1
          fi
          cat /tmp/episode.json
          echo "video=$(python -c 'import json; print(json.load(open("/tmp/episode.json"))["video"])')" >> "$GITHUB_OUTPUT"
          echo "title=$(python -c 'import json; print(json.load(open("/tmp/episode.json"))["title"])')" >> "$GITHUB_OUTPUT"
          echo "description=$(python -c 'import json; print(json.load(open("/tmp/episode.json"))["description"])')" >> "$GITHUB_OUTPUT"
          echo "slug=$(python -c 'import json; print(json.load(open("/tmp/episode.json"))["slug"])')" >> "$GITHUB_OUTPUT"
          echo "tags=$(python -c 'import json; print(json.dumps(json.load(open("/tmp/episode.json"))["tags"]))')" >> "$GITHUB_OUTPUT"
          echo "publish_at=$(TZ=Asia/Kolkata date '+%Y-%m-%dT18:00:00+05:30')" >> "$GITHUB_OUTPUT"
          echo "report_dir=outputs/$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"
      - name: Push temporary MP4 and keep episode report
        if: ${{ steps.guard.outputs.skip != 'true' }}
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIDEO_PATH: ${{ steps.render.outputs.video }}
          REPORT_DIR: ${{ steps.render.outputs.report_dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VIDEO_PATH" "$REPORT_DIR/report.json" "$REPORT_DIR/episode.json" "$REPORT_DIR/storyboard.jpg" automation/used-premises.json
          git commit -m "Render daily What If episode"
          git push origin HEAD:main
          REPO_PATH="${VIDEO_PATH#./}"
          echo "repo_path=$REPO_PATH" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 10); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${REPO_PATH}")
            if [ "$code" = 200 ]; then break; fi
            sleep 3
          done
          test "$code" = 200 || { echo "Raw MP4 check failed: HTTP $code"; exit 1; }
          echo "raw_url=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${REPO_PATH}" >> "$GITHUB_OUTPUT"
          sha=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${REPO_PATH}?ref=main" | jq -r .sha)
          test -n "$sha" -a "$sha" != null || { echo "Could not read temporary MP4 blob SHA"; exit 1; }
          echo "file_sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Hand off to Make, then remove the temporary MP4
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          VIDEO_URL: ${{ steps.push.outputs.raw_url }}
          FILE_PATH: ${{ steps.push.outputs.repo_path }}
          FILE_SHA: ${{ steps.push.outputs.file_sha }}
          TITLE: ${{ steps.render.outputs.title }}
          DESCRIPTION: ${{ steps.render.outputs.description }}
          TAGS: ${{ steps.render.outputs.tags }}
          SLUG: ${{ steps.render.outputs.slug }}
          PUBLISH_AT: ${{ steps.render.outputs.publish_at }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$MAKE_WEBHOOK_URL" || { echo "Set the MAKE_WEBHOOK_URL repository Actions secret first."; exit 1; }
          jq -n \
            --arg video_url "$VIDEO_URL" --arg repo_file_path "$FILE_PATH" \
            --arg file_sha "$FILE_SHA" --arg title "$TITLE" \
            --arg description "$DESCRIPTION" --arg episode_slug "$SLUG" \
            --arg publish_at "$PUBLISH_AT" --argjson tags "$TAGS" \
            '{video_url:$video_url, repo_file_path:$repo_file_path, file_sha:$file_sha, title:$title, description:$description, episode_slug:$episode_slug, publish_at:$publish_at, tags:$tags}' \
            > /tmp/handoff.json
          response=$(curl --fail --silent --show-error --max-time 180 \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/handoff.json "$MAKE_WEBHOOK_URL")
          echo "$response"
          test "$(echo "$response" | jq -r .status)" = scheduled || { echo "Make did not confirm YouTube scheduling."; exit 1; }
          video_id=$(echo "$response" | jq -r .video_id)
          test -n "$video_id" -a "$video_id" != null || { echo "Make did not return a YouTube video id."; exit 1; }
          delete_code=$(curl --silent --output /dev/null --write-out '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -n --arg sha "$FILE_SHA" '{message:"Remove temporary MP4 after YouTube scheduling",sha:$sha,branch:"main"}')" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${FILE_PATH}")
          test "$delete_code" = 200 || { echo "GitHub delete failed: HTTP $delete_code"; exit 1; }
          for attempt in $(seq 1 10); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${FILE_PATH}?ref=main")
            if [ "$code" = 404 ]; then break; fi
            sleep 2
          done
          test "$code" = 404 || { echo "Temporary MP4 still exists: HTTP $code"; exit 1; }
          echo "Scheduled YouTube video $video_id; temporary MP4 deletion verified."
